# Credentials shared by PostgreSQL and the Agent Relay API.
# NOTE: for a homework cluster these are demo values, not real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: agent_relay
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay
  namespace: agent-relay
type: Opaque
stringData:
  # Must match postgres-credentials above; "postgres" resolves to the
  # postgres Service in this namespace via cluster DNS.
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/agent_relay
